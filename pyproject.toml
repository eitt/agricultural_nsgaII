[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriopt-core-annex"
version = "0.3.0"
description = "Optimization core and frozen agricultural production-planning benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "PyYAML>=6.0", "statsmodels>=0.14"]

[project.optional-dependencies]
exact = ["pyscipopt>=5.0"]
test = ["pytest>=8"]

[project.scripts]
agriopt-core = "agriopt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
